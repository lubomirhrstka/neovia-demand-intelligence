name: Apply Seznam UI patch

on:
  workflow_dispatch:
  push:
    paths:
      - "patches/seznam-ui.patch"
      - ".github/workflows/apply-seznam-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch if not already applied
        run: |
          set -e
          if grep -q 'seznam/send' src/app/page.tsx; then
            echo "Seznam UI already applied — skip"
            exit 0
          fi
          if ! grep -q 'Mazání Seznam e-mailů z aplikace zatím' src/app/page.tsx; then
            echo "Expected markers missing — abort"
            exit 1
          fi
          git apply --verbose patches/seznam-ui.patch
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("package.json")
          d = json.loads(p.read_text())
          d["version"] = "1.1.70"
          p.write_text(json.dumps(d, indent=2) + "\n")
          print("version", d["version"])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx package.json
          git commit -m "feat: Seznam full UI — folders, delete, SMTP send, attachments (v1.1.70)"
          git push
