name: Apply Seznam UI patch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-seznam-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Seznam UI via Python
        run: |
          set -e
          python3 -c "import base64,pathlib; pathlib.Path('/tmp/apply_seznam_ui.py').write_bytes(base64.b64decode(open('/tmp/b64.txt').read()))"
