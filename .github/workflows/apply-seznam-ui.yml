name: Apply Seznam UI patch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-seznam-ui.yml"
      - "scripts/seznam_step_*.py"
      - "scripts/apply_seznam_ui_a.txt"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply Seznam UI steps
        run: |
          set -e
          if grep -q 'seznam/send' src/app/page.tsx && grep -q 'countFor("inbox")' src/app/page.tsx && grep -q 'deleteEndpoint' src/app/page.tsx; then
            echo "already applied"
            exit 0
          fi
          python3 scripts/apply_seznam_ui_a.txt
          python3 scripts/seznam_step_send.py
          python3 scripts/seznam_step_note_refresh.py
          python3 scripts/seznam_step_feat_att_sq.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx package.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "feat: Seznam full UI — folders, delete, SMTP send, attachments (v1.1.70)"
          git pull --rebase origin main
          git push origin main
