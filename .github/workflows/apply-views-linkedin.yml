name: Apply views LinkedIn UI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-views-linkedin.yml"
      - "scripts/apply-views-linkedin.py"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Run patch script
        run: |
          set -e
          python3 scripts/apply-views-linkedin.py
          rm -f .github/workflows/apply-seznam-ui.yml \
                .github/workflows/restore-calendar.yml \
                .github/workflows/apply-views-linkedin.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: Doplnit z LinkedIn + uložené pohledy UI, úklid CI (v1.1.72)" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin main
