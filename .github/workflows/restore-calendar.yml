name: Restore CalendarView

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-calendar.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore and patch CalendarView
        run: |
          set -e
          git show e2f24b16a6be7961911cd2ac0e986f94884d3440:src/components/CalendarView.tsx > src/components/CalendarView.tsx
          python3 <<'PY'
          from pathlib import Path
          text = Path("src/components/CalendarView.tsx").read_text()
          if "copyBookingLink" in text:
              print("already patched")
          else:
              fn = '''\n  const copyBookingLink = async () => {\n    const link = `${window.location.origin}/book`;\n    try {\n      await navigator.clipboard.writeText(link);\n      note("Booking odkaz zkopírován do schránky.");\n    } catch {\n      note(link);\n    }\n  };\n\n'''
              text = text.replace("\n  return (\n", fn + "\n  return (\n", 1)
              old = '''          <div className="calendar-actions">\n            <button className="secondary" type="button" onClick={() => syncCalendar(false)} disabled={syncing}>\n              <CalendarDays size={15} />\n              {syncing ? "Synchronizuji…" : "Synchronizovat obousměrně"}\n            </button>\n          </div>'''
              new = '''          <div className="calendar-actions">\n            <button className="secondary" type="button" onClick={() => void copyBookingLink()}>\n              Zkopírovat booking odkaz\n            </button>\n            <button className="secondary" type="button" onClick={() => syncCalendar(false)} disabled={syncing}>\n              <CalendarDays size={15} />\n              {syncing ? "Synchronizuji…" : "Synchronizovat obousměrně"}\n            </button>\n          </div>'''
              if old not in text:
                  raise SystemExit("actions block missing")
              text = text.replace(old, new, 1)
              Path("src/components/CalendarView.tsx").write_text(text)
              print("patched")
          PY
          # bump version
          python3 -c "import json;from pathlib import Path;p=Path('package.json');d=json.loads(p.read_text());d['version']='1.1.71';p.write_text(json.dumps(d,indent=2)+chr(10))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CalendarView.tsx package.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "fix: restore CalendarView + Zkopírovat booking odkaz (v1.1.71)"
          git pull --rebase origin main
          git push origin main
