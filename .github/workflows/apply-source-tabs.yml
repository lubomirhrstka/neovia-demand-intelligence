name: Apply source tabs UI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-source-tabs.yml"
      - "scripts/apply-source-tabs-v2.py"
      - "scripts/source-tabs.css"
      - "src/components/SourceTabsAndFilters.tsx"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply patch
        run: |
          set -e
          python3 scripts/apply-source-tabs-v2.py
          rm -f .github/workflows/apply-source-tabs.yml \
                scripts/apply-source-tabs-v2.py \
                scripts/source-tabs.css \
                scripts/apply-source-tabs.py \
                scripts/_patch_source_tabs_p1.b64 \
                scripts/_patch_source_tabs_p2.b64 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: source tabs + professional filter panel (v1.1.73)" || echo nothing
          git pull --rebase origin main
          git push origin main
